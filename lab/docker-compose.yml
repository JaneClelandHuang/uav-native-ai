# This file only defines the broker. The fleet itself (one sitl_N/
# drone_backend_N pair per vehicle) is generated by scripts/generate_fleet.py
# into docker-compose.override.yml, based on CENTER_LOCATION/NUM_DRONES/etc.
# in .env -- Compose auto-merges that override file, no -f flags needed.
# Run the generator (see SETUP.md) before `docker compose up`.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
